[Unit]
Description=Dsmack direct-NEAR encrypted (firmware warning policy) inference session
ConditionPathIsDirectory=/run/portable-inference

[Service]
ExecStart=
ExecStart=/usr/bin/python3 -I -B /opt/portable/portable/inference/financial-near-run.py

# The unlocked NEAR session ends through explicit lock/shutdown and keeper drain.
# Preserve the base unit's bounded TimeoutStopSec and KillMode.
RuntimeMaxSec=infinity
